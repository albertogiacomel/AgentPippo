name: Audit Cloudflare build authentication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read Worker build authentication metadata
        run: node scripts/cloudflare_builds_audit.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloudflare-build-authentication
          path: artifacts/cloudflare-builds/audit.json
          if-no-files-found: error
