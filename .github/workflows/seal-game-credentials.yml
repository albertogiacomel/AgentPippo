name: Seal deployment credential for game repositories
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-maintenance.txt
      - name: Encrypt to the reviewed GitHub recipient keys
        run: python scripts/seal_game_credentials.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: sealed-game-credentials
          path: artifacts/credential-transfer/sealed.json
          retention-days: 1
          if-no-files-found: error
